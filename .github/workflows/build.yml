name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

  schedule:
    - cron: '0 0 * * *'  
    - cron: '0 12 * * *' 

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device || 'alioth' }} | KSU:true | OS:${{ github.event.inputs.target_os || 'both' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and tags
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: 'android16-aptusitu' 
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
          dwarves libelf-dev
          
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'alioth' }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Modify kernel version string (Remove cip/st extra suffix)
      run: |
        sed -i 's|^EXTRAVERSION =.*|EXTRAVERSION = -ReSukiSU-Ikun-KirinNova|' Makefile
        
        find arch/arm64/configs -maxdepth 1 -type f -name "*defconfig" | while read file
        do
          sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$file"
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> "$file"
          sed -i '/CONFIG_LOCALVERSION=/d' "$file"
          echo 'CONFIG_LOCALVERSION=""' >> "$file"
        done
        
        echo '#!/bin/sh' > scripts/setlocalversion
        echo 'echo ""' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        export LOCALVERSION=""
        
        DEVICE="${{ github.event.inputs.device }}"
        [ -z "$DEVICE" ] && DEVICE="alioth"
        
        KSU="${{ github.event.inputs.ksu }}"
        [ -z "$KSU" ] && KSU="true"
        
        TARGET_OS="${{ github.event.inputs.target_os }}"
        [ -z "$TARGET_OS" ] && TARGET_OS="both"
        
        ARGS="$DEVICE"
        if [ "$KSU" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        
        if [ "$TARGET_OS" != "both" ]; then
          ARGS="$ARGS $TARGET_OS"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: DEBUG_APTKernel-${{ github.event.inputs.device || 'alioth' }}-${{ github.event.inputs.target_os || 'both' }}-${{ github.run_id }}
        path: "*APTKernel_*.zip"
        compression-level: 0

    - name: Get Build Metadata
      id: metadata
      run: |
        echo "DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> $github_output
        TAG_NAME="v$(TZ='Asia/Shanghai' date '+%Y%m%d-%H%M')-${{ github.event.inputs.device || 'alioth' }}"
        echo "TAG_NAME=$TAG_NAME" >> $github_output
        
        ZIP_FILE=$(ls *APTKernel_*.zip | head -n 1)
        if [ -f "$ZIP_FILE" ]; then
          FILE_SIZE=$(du -h "$ZIP_FILE" | awk '{print $1}')
          echo "ZIP_NAME=$ZIP_FILE" >> $github_output
          echo "ZIP_SIZE=$FILE_SIZE" >> $github_output
        else
          echo "ZIP_SIZE=Unknown" >> $github_output
        fi

    - name: Release and Publish to GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.metadata.outputs.TAG_NAME }}
        name: "Kernel Build for ${{ github.event.inputs.device || 'alioth' }} (${{ steps.metadata.outputs.DATE }})"
        files: "*APTKernel_*.zip"
        body: |

          * **Branch (构建分支):** `android16-aptusitu`
          * **Trigger Type (触发方式):** `${{ github.event_name }}`
          * **Target Device (设备代号):** `${{ github.event.inputs.device || 'alioth' }}`
          * **KernelSU (KSU):** `true`
          * **Target OS (目标系统):** `${{ github.event.inputs.target_os || 'both' }}`
          * **Build Date (构建时间):** `${{ steps.metadata.outputs.DATE }} (CST)`
          * **Package Name (文件名):** `${{ steps.metadata.outputs.ZIP_NAME }}`
          * **Package Size (文件大小):** `${{ steps.metadata.outputs.ZIP_SIZE }}`
          * **Compiler Toolchain:** ZyCromerZ Clang 16.0.6

          * Built from branch: `android16-aptusitu`
          * Includes KernelSU (ReSukiSU)
          * Updated with custom suffix: `-ReSukiSU-Ikun-KirinNova`
          * Cleaned extra localversion strings (`CIP`/`ST`)
